<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신나는 구구단 여행!</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🚀 신나는 구구단 대탐험</h1>
            <nav class="mode-toggle">
                <button id="btn-study" class="active">공부하기 📚</button>
                <button id="btn-quiz">퀴즈풀기 🎮</button>
            </nav>
        </header>

        <main>
            <!-- Study Mode -->
            <section id="study-mode" class="active-mode">
                <div class="table-grid" id="table-container">
                    <!-- Tables generated by JS -->
                </div>
            </section>

            <!-- Quiz Mode -->
            <section id="quiz-mode" class="hidden-mode">
                <div class="quiz-container">
                    <div class="score-board">
                        <span>점수: <strong id="score-display">0</strong></span>
                        <div class="stars" id="stars-container"></div>
                    </div>
                    
                    <div class="question-box">
                        <span id="q-num1">?</span>
                        <span class="operator">×</span>
                        <span id="q-num2">?</span>
                        <span class="equals">=</span>
                        <span class="answer-box">?</span>
                    </div>

                    <div class="options-grid" id="options-container">
                        <!-- Options generated by JS -->
                    </div>

                    <div id="feedback-message" class="feedback"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
